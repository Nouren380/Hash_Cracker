{% extends "base.html" %}
{% block title %}Reports · Hash Cracker{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Reports</h1>
  <p class="page-subtitle">Summaries generated by the Backend from real cracking activity.</p>
</div>

<div class="banner banner-error" id="reports-error-banner"></div>

<div class="panel">
  <div id="reports-container">
    <div class="empty-state">
      <div class="empty-state-title">Loading reports</div>
      <div class="empty-state-body">Fetching reports from the Backend.</div>
    </div>
  </div>
</div>

<template id="reports-empty-template">
  <div class="empty-state">
    <div class="empty-state-title">No reports yet</div>
    <div class="empty-state-body">Reports will appear here once the Backend has generated at least one.</div>
  </div>
</template>

<template id="report-row-template">
  <div class="stat-box" style="margin-bottom: 14px;">
    <div class="stat-box-value" data-field="total_found" style="font-size: 18px;"></div>
    <div class="stat-box-label" data-field="title"></div>
  </div>
</template>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/reports.js') }}"></script>
{% endblock %}
