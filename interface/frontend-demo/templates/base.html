<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hash Cracker{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">hash://</div>
      <div class="sidebar-brand-name">Hash Cracker</div>
    </div>
    <div class="sidebar-nav">
      <a class="sidebar-link {{ 'active' if active_page == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">
        <span class="sidebar-link-icon">01</span> Dashboard
      </a>
      <a class="sidebar-link {{ 'active' if active_page == 'crack' else '' }}" href="{{ url_for('crack') }}">
        <span class="sidebar-link-icon">02</span> Crack a hash
      </a>
      <a class="sidebar-link {{ 'active' if active_page == 'results' else '' }}" href="{{ url_for('results') }}">
        <span class="sidebar-link-icon">03</span> Results
      </a>
      <a class="sidebar-link {{ 'active' if active_page == 'history' else '' }}" href="{{ url_for('history') }}">
        <span class="sidebar-link-icon">04</span> History
      </a>
      <a class="sidebar-link {{ 'active' if active_page == 'reports' else '' }}" href="{{ url_for('reports') }}">
        <span class="sidebar-link-icon">05</span> Reports
      </a>
      <a class="sidebar-link {{ 'active' if active_page == 'settings' else '' }}" href="{{ url_for('settings') }}">
        <span class="sidebar-link-icon">06</span> Settings
      </a>
    </div>
    <div class="sidebar-footer">Dictionary Attack only · Frontend build</div>
  </nav>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<script>
  window.HASH_CRACKER_API_MODE = new URLSearchParams(window.location.search).get("mode") === "mock" ? "mock" : "live";
</script>
<script src="{{ url_for('static', filename='js/algorithms.js') }}"></script>
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
<script src="{{ url_for('static', filename='js/mock-api.js') }}"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
